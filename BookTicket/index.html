<html>
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Book a Ticket - OnTrack</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <h1>Book an Amtrak Ticket</h1>
    <input type = "text" placeholder="Origin Station Code" id = "origin">
    <input type = "text" placeholder="Destination Station Code" id = "destination">
    <input type = "text" placeholder="Date MM/DD/YYYY" id = "date" lang="en-US">
    <input type = "number" placeholder="Number of Adults" id = "adults">
    <button onclick = "Submit()">Submit</button>
    <script src="script.js" crossorigin="anonymous"></script>
</body>
</html>
